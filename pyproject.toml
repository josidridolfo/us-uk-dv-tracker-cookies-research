[project]
name = "us-uk-dv-tracker-cookies-research"
version = "0.1.0"
description = "Comparison of pre-consent third-party tracking on US and UK domestic violence support websites"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Wm. Josid Ridolfo", email = "josid.ridolfo@gmail.com" },
]
keywords = [
    "web-measurement",
    "privacy",
    "tracking",
    "gdpr",
    "cookies",
    "consent",
    "domestic-violence",
    "vulnerable-populations",
]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "duckdb>=0.10",
    "tldextract>=5.0",
    "polars>=0.20",
    "adblock==0.6.0",
]

[project.scripts]
dv-check-exit = "dv_tracking.egress:main"
dv-analyze = "dv_tracking.analysis.analyze:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dv_tracking"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
pythonpath = ["src"]
